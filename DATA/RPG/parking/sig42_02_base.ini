text_ru = Вы уже приобрели максимальное число мест на этой базе.
text_en = You already own the maximum number of slots at this base.

[DialogNode]
nickname = parking_error
text_ru = Покупка не состоялась. Уточните условия ещё раз.
text_en = No purchase was made. Please request a new quote.

[DialogNode]
nickname = parking_help
text_ru = Место действует только на этой базе и остаётся вашим после вывоза корабля. Активный корабль места не занимает. На полной стоянке можно обменять корабли.
text_en = Slots belong to this base and remain yours after collecting a ship. Your active ship uses no slot. You can switch ships even when parking is full.

