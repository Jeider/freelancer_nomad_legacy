[DialogNode]
nickname = coupling
text_ru = У маркера погрузки отключи круиз и автопилот. Выровняй локомотив с вагонами и подведи кормовую сцепку к первому вагону: не дальше пятнадцати метров, скорость сближения — до двух метров в секунду. Нажми «Сцепить вагоны» и дождись подтверждения.
text_en = At the pickup marker, turn off cruise and autopilot. Align with the wagons and bring the rear coupling up to the first wagon: within fifteen metres, at a closing speed no higher than two metres per second. Press Couple wagons and wait for confirmation.
fragment = rm0001_frag0029

