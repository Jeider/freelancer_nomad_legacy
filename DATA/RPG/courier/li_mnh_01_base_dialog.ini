[DialogNode]
nickname = delivery
text_ru = Система назначения указана в наряде, маршрут — в навигации. Приведи вагоны к маркеру получателя, отключи круиз и автопилот и остановись. Нажми «Отцепить вагоны». Дождись подтверждения сдачи и оплаты.
text_en = The work order names the destination system, and navigation shows the route. Bring the wagons to the delivery marker, turn off cruise and autopilot, and stop. Press Uncouple wagons, then wait for delivery and payment confirmation.
fragment = rm0001_frag0031

