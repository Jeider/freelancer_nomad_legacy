[DialogNode]
nickname = boarding
text_ru = Получи наряд и вылетай. Локомотив ждёт у причала и отмечен заданием. Выбери его и выполни обычную стыковку: так ты займёшь место машиниста. Личный корабль останется на хранении.
text_en = Take the work order and launch. The locomotive is waiting by the docking fixture, marked as your objective. Select it and use the normal docking command to take the controls. Your own ship will be stored.
fragment = rm0001_frag0027

