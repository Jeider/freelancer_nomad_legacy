[Mission]
nickname = om15_train

[Trigger]
nickname = board_train
InitState = ACTIVE
Cnd_True = no_params
Act_CacheShipAndSetLoadout = player_ship, ge_train_player, rpg_ge_train_player
Act_ActTrig = fly_to_bremen

[Trigger]
nickname = fly_to_bremen
Cnd_BaseEnter = rh_biz_02_base
