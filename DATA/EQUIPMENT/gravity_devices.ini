; Dedicated gravity hardware for ship and solar loadouts; no CMP hardpoint required.
; Declare on [Ship] or [Solar]: equipment_slot = HpHardware01, hardware, 10
; Mount in loadout: equip = gravity_generator, HpHardware01
; hp_hardware_special_1 through hp_hardware_special_10 are supported.
; Add localized ids_name / ids_info and goods/market entries before selling these prototypes.

[GravityDevice]
nickname = gravity_generator
hit_pts = 1000
mass = 0
volume = 1
lootable = false
hp_type = hp_hardware_special_1
gravity = true
gravity_mode = attract
gravity_radius = 5000
gravity_reference_radius = 1000
gravity_acceleration = 10
gravity_softening = 250
gravity_max_acceleration = 40
gravity_edge_fraction = 0.2

[GravityDevice]
nickname = gravity_repulsor
inherit = gravity_generator
gravity_mode = repel

[GravityDevice]
nickname = gravity_suppressor
inherit = gravity_generator
gravity_mode = suppress
gravity_suppression = 1

[GravityDevice]
nickname = gravity_compensator_70
hit_pts = 1000
mass = 0
volume = 1
lootable = false
hp_type = hp_hardware_special_1
gravity_compensation = 0.7

[GravityDevice]
nickname = gravity_compensator_full
inherit = gravity_compensator_70
gravity_compensation = 1
