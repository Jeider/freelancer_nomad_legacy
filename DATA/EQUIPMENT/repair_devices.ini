; Optional automatic repair module, independent of RepairKit nanobots.
; Install into a declared hardware slot: equip = repair_droid_auto, HpHardware02
; Health window button toggles repair. Starts off after loading/launching.
; hit_pts is its separate repair reserve; repair_rate is HP/second.
; Add goods/markets and localized infocards for shop availability.
[RepairDroid]
nickname = repair_droid_auto
hit_pts = 10000
repair_rate = 50
hp_type = hp_hardware_special_1
mass = 0
volume = 1
lootable = false
